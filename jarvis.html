<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS — Sistema de IA Pessoal</title>
  <meta name="description" content="Assistente de voz pessoal Jarvis com Second Brain neural e IA contextual.">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --c:   #00d4ff;
      --cg:  rgba(0, 212, 255, 0.35);
      --bg:  #04090e;
      --bg2: #070d15;
      --bg3: #0b1620;
      --tx:  #d8efff;
      --txd: #6a9ab5;
      --brd: rgba(0, 212, 255, 0.18);
      --mono: 'Courier New', Courier, monospace;
      --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }

    html, body {
      width: 100%; min-height: 100%;
      background: var(--bg);
      background-image:
        linear-gradient(rgba(0,212,255,0.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.022) 1px, transparent 1px);
      background-size: 48px 48px;
      color: var(--tx);
      font-family: var(--sans);
      overflow-x: hidden;
    }

    @keyframes blink    { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes slide-in { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    @keyframes orb-idle {
      0%,100%{transform:scale(1);box-shadow:0 0 40px var(--cg),0 0 80px rgba(0,212,255,.18),inset 0 0 25px rgba(0,212,255,.08)}
      50%{transform:scale(1.03);box-shadow:0 0 60px var(--cg),0 0 120px rgba(0,212,255,.26),inset 0 0 35px rgba(0,212,255,.12)}
    }
    @keyframes orb-listen {
      0%{transform:scale(1);box-shadow:0 0 55px rgba(0,212,255,.9),0 0 110px rgba(0,212,255,.4)}
      33%{transform:scale(1.07);box-shadow:0 0 85px rgba(0,212,255,1),0 0 170px rgba(0,212,255,.5)}
      66%{transform:scale(.96);box-shadow:0 0 30px rgba(0,212,255,.7),0 0 60px rgba(0,212,255,.22)}
      100%{transform:scale(1);box-shadow:0 0 55px rgba(0,212,255,.9),0 0 110px rgba(0,212,255,.4)}
    }
    @keyframes orb-think {
      0%{transform:scale(1) rotate(0deg);box-shadow:0 0 40px var(--cg)}
      25%{transform:scale(1.1) rotate(90deg);box-shadow:0 0 90px rgba(0,212,255,1)}
      50%{transform:scale(.92) rotate(180deg);box-shadow:0 0 18px rgba(0,212,255,.35)}
      75%{transform:scale(1.07) rotate(270deg);box-shadow:0 0 75px rgba(0,212,255,.95)}
      100%{transform:scale(1) rotate(360deg);box-shadow:0 0 40px var(--cg)}
    }
    @keyframes orb-speak {
      0%,100%{transform:scale(1.02);box-shadow:0 0 55px rgba(0,212,255,.7),0 0 110px rgba(0,212,255,.32)}
      50%{transform:scale(1.07);box-shadow:0 0 80px rgba(0,212,255,.95),0 0 160px rgba(0,212,255,.45)}
    }
    @keyframes ring-breathe {
      0%,100%{opacity:.28;transform:translate(-50%,-50%) scale(1)}
      50%{opacity:.05;transform:translate(-50%,-50%) scale(1.07)}
    }

    /* BOOT */
    #boot {
      position:fixed;inset:0;z-index:1000;background:var(--bg);
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;
      transition:opacity .7s ease;
    }
    #boot.out{opacity:0;pointer-events:none}
    .boot-sl{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,212,255,.012) 2px,rgba(0,212,255,.012) 4px)}
    .h-name{font-family:var(--mono);font-size:clamp(3rem,10vw,7rem);font-weight:700;letter-spacing:.35em;background:linear-gradient(100deg,#00d4ff 0%,#7b3fff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .h-hr{width:min(80%,620px);height:2px;border:none;background:linear-gradient(90deg,transparent,#00d4ff,#7b3fff,transparent)}
    .boot-sync{font-family:var(--mono);font-size:.95rem;letter-spacing:.22em;color:var(--c);animation:blink .75s step-end infinite}
    .boot-ver{font-family:var(--mono);font-size:.72rem;letter-spacing:.18em;color:var(--txd);margin-top:.4rem}

    /* ACTIVATION */
    #act{position:fixed;inset:0;z-index:999;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:2rem;transition:opacity .5s ease}
    #act.show{display:flex}
    #act.out{opacity:0;pointer-events:none}
    #btn-act{font-family:var(--mono);font-size:1.05rem;letter-spacing:.22em;color:var(--c);background:transparent;border:2px solid var(--c);padding:1rem 3.5rem;cursor:pointer;position:relative;overflow:hidden;transition:color .3s}
    #btn-act::before{content:'';position:absolute;inset:0;background:var(--c);transform:translateX(-101%);transition:transform .3s ease;z-index:-1}
    #btn-act:hover::before{transform:translateX(0)}
    #btn-act:hover{color:var(--bg)}
    .act-hint{font-family:var(--mono);font-size:.72rem;letter-spacing:.22em;color:var(--txd);animation:blink 1.6s step-end infinite}

    /* APP */
    #app{display:none;flex-direction:column;min-height:100vh;padding-bottom:3rem}
    #app.show{display:flex}

    /* API BAR */
    #api-bar{background:var(--bg2);border-bottom:1px solid var(--brd);padding:.55rem 1.25rem;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;position:sticky;top:0;z-index:100}
    #api-bar label{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;color:var(--txd);white-space:nowrap}
    #api-in{flex:1;min-width:180px;background:var(--bg3);border:1px solid var(--brd);color:var(--tx);font-family:var(--mono);font-size:.73rem;padding:.38rem .7rem;outline:none;transition:border-color .2s}
    #api-in:focus{border-color:var(--c)}
    #btn-api{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;color:var(--c);background:transparent;border:1px solid var(--c);padding:.38rem .95rem;cursor:pointer;transition:all .2s}
    #btn-api:hover{background:var(--c);color:var(--bg)}
    #api-ok{font-family:var(--mono);font-size:.65rem;color:#10b981;letter-spacing:.1em}

    /* CORE */
    #core{display:flex;flex-direction:column;align-items:center;padding:2.2rem 1rem 1.8rem;gap:1.3rem}
    .j-label{font-family:var(--mono);font-size:clamp(.95rem,2.8vw,1.35rem);letter-spacing:.45em;background:linear-gradient(100deg,#00d4ff,#7b3fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    #orb-wrap{position:relative;width:170px;height:170px;cursor:pointer}
    .orb-ring{position:absolute;top:50%;left:50%;border-radius:50%;border:1px solid rgba(0,212,255,.26);animation:ring-breathe 3s ease-in-out infinite}
    .orb-ring:nth-child(1){width:196px;height:196px;animation-delay:0s}
    .orb-ring:nth-child(2){width:230px;height:230px;animation-delay:.6s}
    .orb-ring:nth-child(3){width:264px;height:264px;animation-delay:1.1s}
    #orb{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 38% 32%,#38ccff 0%,#006699 38%,#001828 100%);animation:orb-idle 3s ease-in-out infinite}
    #orb::after{content:'';position:absolute;inset:10px;border-radius:50%;border:1px solid rgba(0,212,255,.38)}
    #orb.s-listen{animation:orb-listen .9s ease-in-out infinite}
    #orb.s-think{animation:orb-think .44s linear infinite}
    #orb.s-speak{animation:orb-speak .75s ease-in-out infinite}

    .status-area{width:100%;max-width:640px;display:flex;flex-direction:column;gap:.55rem;text-align:center}
    #user-ln{font-family:var(--mono);font-size:.82rem;color:var(--txd);letter-spacing:.05em;min-height:1.2em}
    #user-ln em{color:var(--c);font-style:normal}
    #resp-ln{font-family:var(--sans);font-size:.97rem;color:var(--tx);line-height:1.65;min-height:2.2em;padding:.75rem 1rem;background:rgba(0,212,255,.033);border:1px solid var(--brd);animation:slide-in .3s ease}
    #status-ln{font-family:var(--mono);font-size:.68rem;letter-spacing:.18em;color:var(--c);min-height:1em}

    .controls{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;justify-content:center}
    #btn-mic,#btn-stop{width:52px;height:52px;border-radius:50%;border:2px solid;background:transparent;font-size:1.25rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .22s}
    #btn-mic{border-color:var(--c);color:var(--c)}
    #btn-mic:hover{background:var(--c);color:var(--bg)}
    #btn-stop{border-color:#ff4455;color:#ff4455}
    #btn-stop:hover{background:#ff4455;color:#fff}

    .txt-row{display:flex;gap:.5rem;width:100%;max-width:540px}
    #txt-in{flex:1;background:var(--bg3);border:1px solid var(--brd);color:var(--tx);font-family:var(--sans);font-size:.9rem;padding:.58rem .95rem;outline:none;transition:border-color .2s}
    #txt-in:focus{border-color:var(--c)}
    #txt-in::placeholder{color:var(--txd);font-size:.78rem}
    #btn-send{background:var(--c);color:var(--bg);border:none;padding:.58rem 1.2rem;font-family:var(--mono);font-size:.75rem;letter-spacing:.1em;cursor:pointer;transition:opacity .2s}
    #btn-send:hover{opacity:.8}

    .div-hr{width:100%;height:1px;background:linear-gradient(90deg,transparent,var(--brd),transparent);margin:.4rem 0}

    /* SECOND BRAIN */
    #sb{width:100%;padding:0 1rem}
    .sb-hdr{display:flex;align-items:center;justify-content:space-between;padding:.7rem 1rem;background:var(--bg2);border:1px solid var(--brd);border-bottom:none;flex-wrap:wrap;gap:.5rem}
    .sb-tg{display:flex;align-items:center;gap:.75rem}
    .sb-t{font-family:var(--mono);font-size:.82rem;letter-spacing:.22em;color:var(--c)}
    .sb-s{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;color:var(--txd)}
    .sb-meta{display:flex;align-items:center;gap:.65rem}
    #sb-cnt{font-family:var(--mono);font-size:.68rem;color:var(--txd);letter-spacing:.1em}
    .sb-btn{background:transparent;border:1px solid var(--brd);color:var(--txd);font-size:1rem;width:27px;height:27px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
    .sb-btn:hover{border-color:var(--c);color:var(--c)}
    #graph-wrap{background:var(--bg2);border:1px solid var(--brd);width:100%;height:clamp(280px,45vw,520px);position:relative;overflow:hidden}
    .sb-leg{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem;padding:.7rem 1rem;background:var(--bg2);border:1px solid var(--brd);border-top:none}
    .leg-items{display:flex;flex-wrap:wrap;gap:.65rem}
    .leg-i{display:flex;align-items:center;gap:.32rem;font-family:var(--mono);font-size:.62rem;color:var(--txd);letter-spacing:.05em}
    .leg-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
    .sb-inj{font-family:var(--mono);font-size:.62rem;color:#10b981;letter-spacing:.05em}

    /* MODAL */
    #mdl-ov{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.83);display:none;align-items:center;justify-content:center;padding:1rem}
    #mdl-ov.show{display:flex}
    #mdl{background:var(--bg2);border:1px solid var(--brd);padding:1.8rem;width:100%;max-width:460px;display:flex;flex-direction:column;gap:.95rem;animation:slide-in .25s ease}
    .mdl-title{font-family:var(--mono);font-size:.88rem;letter-spacing:.22em;color:var(--c)}
    .mdl-fld{display:flex;flex-direction:column;gap:.3rem}
    .mdl-lbl{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;color:var(--txd)}
    .mdl-in,.mdl-sel,.mdl-ta{background:var(--bg3);border:1px solid var(--brd);color:var(--tx);font-family:var(--sans);font-size:.88rem;padding:.48rem .72rem;outline:none;width:100%;transition:border-color .2s}
    .mdl-in:focus,.mdl-sel:focus,.mdl-ta:focus{border-color:var(--c)}
    .mdl-sel option{background:var(--bg2)}
    .mdl-ta{resize:vertical;min-height:90px}
    .mdl-btns{display:flex;gap:.65rem;justify-content:flex-end;flex-wrap:wrap;margin-top:.2rem}
    .mb{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;padding:.48rem 1.2rem;cursor:pointer;border:1px solid;background:transparent;transition:all .2s}
    .mb-save{color:var(--c);border-color:var(--c)} .mb-save:hover{background:var(--c);color:var(--bg)}
    .mb-del{color:#ff4455;border-color:#ff4455}     .mb-del:hover{background:#ff4455;color:#fff}
    .mb-cxl{color:var(--txd);border-color:var(--txd)} .mb-cxl:hover{background:var(--txd);color:var(--bg)}

    @media(max-width:480px){
      #orb-wrap{width:130px;height:130px}
      .orb-ring:nth-child(1){width:152px;height:152px}
      .orb-ring:nth-child(2){width:180px;height:180px}
      .orb-ring:nth-child(3){width:208px;height:208px}
      .h-name{letter-spacing:.18em}
      .sb-hdr{flex-direction:column;align-items:flex-start}
    }
  </style>
</head>
<body>

<!-- BOOT -->
<div id="boot">
  <div class="boot-sl"></div>
  <div class="h-name">JARVIS</div>
  <hr class="h-hr">
  <div class="boot-sync">SINCRONIZANDO DADOS...</div>
  <div class="boot-ver">v5.0 · REBUILD</div>
</div>

<!-- ACTIVATION -->
<div id="act">
  <div class="h-name">JARVIS</div>
  <button id="btn-act">&#9658; ATIVAR SISTEMA</button>
  <div class="act-hint">CLIQUE PARA INICIAR</div>
</div>

<!-- APP -->
<div id="app">
  <div id="api-bar">
    <label for="api-in">&#128273; API KEY</label>
    <input type="password" id="api-in" placeholder="sk-ant-..." autocomplete="off" spellcheck="false">
    <label for="sel-model" style="margin-left:.5rem;">🤖 MODELO</label>
    <select id="sel-model" style="background:var(--bg3);border:1px solid var(--brd);color:var(--c);font-family:var(--mono);font-size:.7rem;padding:.35rem .5rem;outline:none;">
      <option value="claude-sonnet-5" selected>claude-sonnet-5</option>
      <option value="claude-sonnet-4-6">claude-sonnet-4-6</option>
      <option value="claude-3-7-sonnet-latest">claude-3-7-sonnet-latest</option>
      <option value="claude-3-5-sonnet-latest">claude-3-5-sonnet-latest</option>
      <option value="claude-3-5-haiku-latest">claude-3-5-haiku-latest</option>
      <option value="claude-3-haiku-20240307">claude-3-haiku-20240307</option>
      <option value="claude-3-opus-latest">claude-3-opus-latest</option>
      <option value="claude-3-5-sonnet-20241022">claude-3-5-sonnet-20241022</option>
    </select>
    <button id="btn-api">SALVAR</button>
    <button id="btn-test" style="font-family:var(--mono);font-size:.68rem;color:#2dd4ff;background:transparent;border:1px solid #2dd4ff;padding:.38rem .7rem;cursor:pointer;">TESTAR</button>
    <button id="btn-scan" style="font-family:var(--mono);font-size:.68rem;color:#fbbf24;background:transparent;border:1px solid #fbbf24;padding:.38rem .7rem;cursor:pointer;">🔍 VARRER MODELOS</button>
    <span id="api-ok"></span>
  </div>

  <div id="core">
    <div class="j-label">J A R V I S</div>
    <div id="orb-wrap">
      <div class="orb-ring"></div>
      <div class="orb-ring"></div>
      <div class="orb-ring"></div>
      <div id="orb"></div>
    </div>
    <div class="status-area">
      <div id="user-ln">· aguardando ativação ·</div>
      <div id="resp-ln"></div>
      <div id="status-ln">SISTEMA PRONTO</div>
    </div>
    <div class="controls">
      <button id="btn-mic" title="Ativar microfone">&#127897;</button>
      <button id="btn-stop" title="Interromper fala">&#9209;</button>
    </div>
    <div class="txt-row">
      <input type="text" id="txt-in" placeholder="ou digite e tecle Enter..." spellcheck="false">
      <button id="btn-send">ENVIAR</button>
    </div>
  </div>

  <div class="div-hr"></div>

  <div id="sb">
    <div class="sb-hdr">
      <div class="sb-tg">
        <span class="sb-t">&#129504; SECOND BRAIN</span>
        <span class="sb-s">MEMORIA NEURAL ATIVA</span>
      </div>
      <div class="sb-meta">
        <span id="sb-cnt">— notas</span>
        <button class="sb-btn" id="btn-add" title="Nova nota">+</button>
        <button class="sb-btn" id="btn-reload" title="Recarregar">&#8635;</button>
      </div>
    </div>
    <div id="graph-wrap"></div>
    <div class="sb-leg">
      <div class="leg-items" id="leg"></div>
      <div class="sb-inj">&#10003; contexto injetado em todos os comandos do Jarvis</div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div id="mdl-ov">
  <div id="mdl">
    <div class="mdl-title" id="mdl-title">NOVA NOTA</div>
    <div class="mdl-fld">
      <div class="mdl-lbl">TITULO</div>
      <input type="text" class="mdl-in" id="mn-title" placeholder="Titulo curto...">
    </div>
    <div class="mdl-fld">
      <div class="mdl-lbl">AREA</div>
      <select class="mdl-sel" id="mn-area">
        <option value="meta">Pessoal / Voce</option>
        <option value="metas">Metas</option>
        <option value="trabalho">Carreira</option>
        <option value="projetos">Projetos</option>
        <option value="financas">Financas</option>
        <option value="aprendizado">Aprendizado</option>
        <option value="saude">Saude</option>
        <option value="relacoes">Relacoes</option>
      </select>
    </div>
    <div class="mdl-fld">
      <div class="mdl-lbl">CONTEUDO</div>
      <textarea class="mdl-ta" id="mn-body" placeholder="Detalhes..."></textarea>
    </div>
    <div class="mdl-btns">
      <button class="mb mb-del" id="mb-del" style="display:none">EXCLUIR</button>
      <button class="mb mb-cxl" id="mb-cxl">CANCELAR</button>
      <button class="mb mb-save" id="mb-save">SALVAR</button>
    </div>
  </div>
</div>

function loadVoices() {
  var vs = speechSynthesis.getVoices();
  if (!vs.length) return;
  var ptBR = vs.filter(function(v){ return v.lang==='pt-BR'||v.lang==='pt_BR'; });
  var ptAny = vs.filter(function(v){ return v.lang.indexOf('pt')===0; });
  if (CONFIG.voiceGender === 'male') {
    selVoice = ptBR.find(function(v){ return /daniel|edgard|lucas|male/i.test(v.name); }) ||
               ptBR.find(function(v){ return !/luciana|francisca|female/i.test(v.name); }) ||
               ptBR[0] || ptAny[0];
  } else {
    selVoice = ptBR.find(function(v){ return /luciana|francisca/i.test(v.name); }) || ptBR[0] || ptAny[0];
  }
  if (!selVoice && vs.length) selVoice = vs[0];
}

function speak(text) {
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang  = 'pt-BR';
  u.rate  = 0.93;
  u.pitch = CONFIG.voiceGender==='male' ? 0.88 : 1.1;
  if (selVoice) u.voice = selVoice;

  u.onend = u.onerror = function() {
    busy = false; orbState('');

    safeStart();
  };
  speechSynthesis.speak(u);
}

// STT
var recogRunning = false;
var micDenied = false;

function initSTT() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    setStatus('VOZ NAO SUPORTADA (USE O CAMPO DE TEXTO)', false);
    return;
  }
  if (location.protocol === 'file:') {
    setStatus('ABRA VIA SERVIDOR LOCAL PARA O MICROFONE FUNCIONAR (veja iniciar-jarvis)', false);
  }
  if (!recognition) {
    recognition = new SR();
    recognition.lang           = 'pt-BR';
    recognition.continuous     = true;
    recognition.interimResults = false;
    recognition.onstart = function() { recogRunning = true; };
    recognition.onresult = function(e) {
      if (busy) return;
      var raw  = e.results[e.results.length-1][0].transcript.trim();
      var norm = rmAcc(raw.toLowerCase());
      if (!awaitCmd) {
        if (norm.indexOf(CONFIG.wakeWord) >= 0) {
          var after = norm.split(CONFIG.wakeWord).pop().trim();
          if (after.length > 2) { processCmd(raw); }
          else { awaitCmd=true; orbState('s-listen'); setStatus('OUVINDO COMANDO...', false); }
        }
      } else { awaitCmd=false; processCmd(raw); }
    };
    recognition.onerror = function(e) {
      if (e.error==='not-allowed' || e.error==='service-not-allowed') {
        micDenied = true;
        setStatus('MICROFONE BLOQUEADO — PERMITA NAS CONFIGURACOES DO SITE E RECARREGUE', false);
      } else if (e.error==='no-speech' || e.error==='aborted') {
        // erros normais e temporarios, nao contam como bloqueio
      }
    };
    recognition.onend = function() {
      recogRunning = false;
      if (!busy && !micDenied) setTimeout(safeStart, 300);
    };
  }
  safeStart();
}

function safeStart() {
  if (!recognition) { initSTT(); return; }
  if (busy || recogRunning || micDenied) return;
  try { recognition.start(); } catch(e) {}
}

function rmAcc(s) { return s.normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

function setApiOk(m)   { document.getElementById('api-ok').textContent = m; }

async function processCmd(text) {
  if (busy) return;
  var key = getKey();
  if (!key) {
    var m = 'Por favor, cole sua chave da API da Anthropic no campo no topo da pagina, ' + CONFIG.address + '.';
    setUserLn('(sem chave)'); setResp(m); speak(m); return;
  }
  if (!key.startsWith('sk-ant-')) {
    var m = 'Atenção: A chave da Anthropic deve começar com "sk-ant-". Verifique se você não colou uma chave da OpenAI (sk-proj-), ' + CONFIG.address + '.';
    setUserLn('(chave formato inválido)'); setResp(m); speak(m); return;
  }
  busy = true; orbState('s-think'); setUserLn(text); setStatus('PROCESSANDO...', false);
  convHist.push({ role: 'user', content: text });

  var modelsToTry = [
    'claude-sonnet-5',
    'claude-sonnet-4-6',
    'claude-3-5-sonnet-20240620',
    'claude-3-haiku-20240307',
    'claude-3-5-haiku-20241022',
    'claude-3-sonnet-20240229',
    'claude-3-5-sonnet-latest'
  ];

  var lastError = '';

  for (var i = 0; i < modelsToTry.length; i++) {
    var modelName = modelsToTry[i];
    try {
      var res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'x-api-key':                               key,
          'anthropic-version':                       '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
          'content-type':                            'application/json'
        },
        body: JSON.stringify({
          model:      modelName,
          max_tokens: 400,
          system:     buildSys(),
          messages:   convHist
        })
      });

      if (res.ok) {
        var data = await res.json();
        var reply = (data && data.content && data.content[0] && data.content[0].text) ? data.content[0].text : '';
        if (!reply) reply = 'Nao recebi resposta valida. Tente novamente, ' + CONFIG.address + '.';
        reply = handleSaves(reply);
        convHist.push({ role: 'assistant', content: reply });
        setResp(reply);
        speak(reply);
        return; // Sucesso!
      } else {
        var errData = await res.json().catch(function(){ return null; });
        if (errData) {
          lastError = errData.error ? (errData.error.type + ': ' + errData.error.message) : JSON.stringify(errData);
        } else {
          lastError = 'Erro HTTP ' + res.status;
        }
        console.warn('Modelo ' + modelName + ' recusado:', errData || res.status);
      }
    } catch(err) {
      lastError = err.message || 'Falha de conexao';
    }
  }

  // Se todos os modelos falharem
  convHist.pop();
  busy = false;
  orbState('');
  var msg = 'Erro na API: ' + lastError + '. Verifique sua chave e saldo em console.anthropic.com, ' + CONFIG.address + '.';
  setResp(msg);
  speak(msg);
}

function buildSys() {
  var id = 'Voce e '+CONFIG.name+', assistente pessoal de IA com personalidade de mordomo britanico formal — refinado, preciso, levemente solene e sempre util. Trate o usuario sempre de "'+CONFIG.address+'". Responda sempre em portugues do Brasil.';
  var rules = 'REGRAS: Seja conciso (2 a 4 frases). Linguagem falada e natural — sem emojis, sem markdown, sem asteriscos. Voce e ouvido em voz alta.';
  var brain = buildBrain();
  var mem = 'PROTOCOLO DE MEMORIA VIVA: Se o usuario revelar algo novo e duradouro, TERMINE sua resposta com exatamente: [[SAVE:area|titulo|texto]] onde area deve ser uma de: metas, trabalho, projetos, financas, aprendizado, saude, relacoes, meta. Inclua APENAS quando houver informacao genuinamente nova.';
  return [id, rules, brain, mem].join('\n\n');
}

function buildBrain() {
  var s = '=== SECOND BRAIN DE LUCAS ===\nContexto completo — use para personalizar todas as respostas:\n\n';
  var g = {};
  notes.forEach(function(n){ if(!g[n.area]) g[n.area]=[]; g[n.area].push(n); });
  Object.keys(g).forEach(function(a) {
    s += '[' + ((AREA[a]&&AREA[a].label)||a).toUpperCase() + ']\n';
    g[a].forEach(function(n){ s += '* ' + n.title + ': ' + n.body + '\n'; });
    s += '\n';
  });
  return s;
}

function handleSaves(text) {
  var re = /\[\[SAVE:([a-z_]+)\|([^|\]]+)\|([\s\S]+?)\]\]/g, m;
  while ((m=re.exec(text))!==null) upsertNote(m[1], m[2].trim(), m[3].trim());
  return text.replace(/\[\[SAVE:[a-z_]+\|[^|]+\|[\s\S]+?\]\]/g,'').trim();
}

function upsertNote(area, title, body) {
  var tl = title.toLowerCase();
  var idx = -1;
  notes.forEach(function(n,i){ if(n.title.toLowerCase()===tl) idx=i; });
  if (idx>=0) {
    notes[idx] = Object.assign({}, notes[idx], {area:area, body:body});
    persist(); renderGraph(); flashNode(notes[idx].id);
  } else {
    var id='nu'+Date.now();
    notes.push({id:id,area:area,title:title,body:body});
    persist(); renderGraph();
    setTimeout(function(){ flashNode(id); }, 250);
  }
  updateCounter(); renderLegend();
}

function flashNode(id) {
  var el = document.querySelector('[data-nid="'+id+'"]');
  if (!el) return;
  var c=0, iv=setInterval(function(){
    el.style.opacity = c++%2 ? '1' : '0.1';
    if (c>7) { clearInterval(iv); el.style.opacity='1'; }
  }, 130);
}

// GRAFO
function renderGraph() {
  if (rafId) { cancelAnimationFrame(rafId); rafId=null; }
  particles=[]; edges=[];
  var W=1000, H=540, cx=W/2, cy=H/2;
  var conn={};
  notes.forEach(function(n){ conn[n.id]=0; });

  var eff=[];
  REL.forEach(function(pair){
    var a=pair[0], b=pair[1];
    var na=notes.filter(function(n){ return n.id===a; })[0];
    var nb=notes.filter(function(n){ return n.id===b; })[0];
    if (na&&nb) {
      eff.push([a,b]);
      conn[a]=(conn[a]||0)+1; conn[b]=(conn[b]||0)+1;
    }
  });
  notes.forEach(function(note) {
    var inRel=REL.some(function(p){ return p[0]===note.id||p[1]===note.id; });
    if (!inRel) {
      var peer=notes.filter(function(n){ return n.area===note.area&&n.id!==note.id; })[0];
      var hub=peer||(notes.filter(function(n){ return n.id==='n2'; })[0])||notes[0];
      if (hub&&hub.id!==note.id) {
        eff.push([note.id,hub.id]);
        conn[note.id]=(conn[note.id]||0)+1; conn[hub.id]=(conn[hub.id]||0)+1;
      }
    }
  });

  var n=notes.length, rx=W*0.37, ry=H*0.37, pos={};
  notes.forEach(function(note,i){
    var a=(2*Math.PI*i/n)-Math.PI/2;
    pos[note.id]={ x:cx+rx*Math.cos(a), y:cy+ry*Math.sin(a) };
  });

  var defs='<defs>'+
    '<filter id="glo" x="-80%" y="-80%" width="260%" height="260%">'+
      '<feGaussianBlur stdDeviation="5" result="b"/>'+
      '<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'+
    '<filter id="cglo" x="-150%" y="-150%" width="400%" height="400%">'+
      '<feGaussianBlur stdDeviation="15" result="b"/>'+
      '<feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'+
    '<radialGradient id="cg" cx="38%" cy="33%" r="62%">'+
      '<stop offset="0%" stop-color="#c084fc"/>'+
      '<stop offset="100%" stop-color="#2e1065"/></radialGradient>'+
    '<linearGradient id="eg" x1="0%" y1="0%" x2="100%" y2="100%">'+
      '<stop offset="0%" stop-color="#7c3aed" stop-opacity="0.9"/>'+
      '<stop offset="100%" stop-color="#00d4ff" stop-opacity="0.9"/></linearGradient>'+
    '</defs>';

  var bg='<rect width="'+W+'" height="'+H+'" fill="#070d15"/>';

  var rays='';
  notes.forEach(function(note){
    var p=pos[note.id], c=(AREA[note.area]&&AREA[note.area].color)||'#8a90a6';
    rays+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p.x.toFixed(1)+'" y2="'+p.y.toFixed(1)+'" stroke="'+c+'" stroke-width="0.7" stroke-opacity="0.18" stroke-dasharray="3,9"/>';
  });

  var edgesHTML='';
  eff.forEach(function(pair,i){
    var pa=pos[pair[0]], pb=pos[pair[1]];
    if (!pa||!pb) return;
    var qx=(pa.x+pb.x)/2+(cx-(pa.x+pb.x)/2)*0.35;
    var qy=(pa.y+pb.y)/2+(cy-(pa.y+pb.y)/2)*0.35;
    var d='M'+pa.x.toFixed(1)+','+pa.y.toFixed(1)+' Q'+qx.toFixed(1)+','+qy.toFixed(1)+' '+pb.x.toFixed(1)+','+pb.y.toFixed(1);
    edges.push({ax:pa.x,ay:pa.y,cx:qx,cy:qy,bx:pb.x,by:pb.y});
    var dur=(2.1+(i%4)*0.45).toFixed(1);
    edgesHTML+='<path d="'+d+'" fill="none" stroke="url(#eg)" stroke-width="1.6" stroke-opacity="0.5" stroke-dasharray="14,8"><animate attributeName="stroke-dashoffset" from="0" to="-110" dur="'+dur+'s" repeatCount="indefinite"/></path>';
  });

  var nodesHTML='';
  notes.forEach(function(note){
    var p=pos[note.id];
    var col=(AREA[note.area]&&AREA[note.area].color)||'#8a90a6';
    var c=conn[note.id]||0, r=17+Math.min(c*3,13), rr=r+8;
    var seed=note.id.charCodeAt(note.id.length-1)||5;
    var dur=(2.0+(seed%4)*0.45).toFixed(1);
    nodesHTML+=
      '<g data-nid="'+note.id+'" onclick="openEdit(\''+note.id+'\')" style="cursor:pointer">'+
        '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+rr+'" fill="none" stroke="'+col+'" stroke-width="1.4" stroke-opacity="0.32">'+
          '<animate attributeName="r" values="'+rr+';'+(rr+5)+';'+rr+'" dur="'+dur+'s" repeatCount="indefinite"/>'+
          '<animate attributeName="stroke-opacity" values="0.32;0.07;0.32" dur="'+dur+'s" repeatCount="indefinite"/>'+
        '</circle>'+
        '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+r+'" fill="'+col+'" fill-opacity="0.88" filter="url(#glo)"/>'+
        '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="1.2"/>'+
        '<text x="'+p.x.toFixed(1)+'" y="'+(p.y+r+15).toFixed(1)+'" text-anchor="middle" font-family="Courier New,monospace" font-size="10.5" fill="#b8d8f0" letter-spacing="0.4">'+escSV(note.title)+'</text>'+
      '</g>';
  });

  var core=
    '<g>'+
      '<circle cx="'+cx+'" cy="'+cy+'" r="44" fill="url(#cg)" filter="url(#cglo)"/>'+
      '<circle cx="'+cx+'" cy="'+cy+'" r="44" fill="none" stroke="#c084fc" stroke-width="1.6">'+
        '<animate attributeName="r" values="44;51;44" dur="2.4s" repeatCount="indefinite"/>'+
        '<animate attributeName="stroke-opacity" values="0.85;0.22;0.85" dur="2.4s" repeatCount="indefinite"/>'+
      '</circle>'+
      '<circle cx="'+cx+'" cy="'+cy+'" r="60" fill="none" stroke="#7c3aed" stroke-width="0.8">'+
        '<animate attributeName="r" values="60;68;60" dur="3.2s" repeatCount="indefinite"/>'+
        '<animate attributeName="stroke-opacity" values="0.32;0.07;0.32" dur="3.2s" repeatCount="indefinite"/>'+
      '</circle>'+
      '<text x="'+cx+'" y="'+(cy+11)+'" text-anchor="middle" font-size="26">&#129504;</text>'+
    '</g>';

  // CRITICO: injeta via innerHTML de DIV, nunca direto no SVG
  var svgStr =
    '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block;">'+
      defs+bg+rays+edgesHTML+nodesHTML+core+
    '</svg>'+
    '<canvas id="syn-cv" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;"></canvas>';

  document.getElementById('graph-wrap').innerHTML = svgStr;
  initParticles();
}

// SINAPSES
function initParticles() {
  if (rafId) cancelAnimationFrame(rafId);
  particles=[];
  if (!edges.length) return;
  for (var i=0;i<12;i++) particles.push(mkPart());
  animateParts();
}
function mkPart() {
  return { e:edges[Math.floor(Math.random()*edges.length)], t:Math.random(), sp:0.003+Math.random()*0.004, op:0 };
}
function bez(t,ax,ay,cxp,cyp,bx,by) {
  var m=1-t;
  return { x:m*m*ax+2*m*t*cxp+t*t*bx, y:m*m*ay+2*m*t*cyp+t*t*by };
}
function animateParts() {
  var cv=document.getElementById('syn-cv');
  if (!cv) { rafId=null; return; }
  var wrap=document.getElementById('graph-wrap');
  if (cv.width!==wrap.offsetWidth||cv.height!==wrap.offsetHeight) {
    cv.width=wrap.offsetWidth; cv.height=wrap.offsetHeight;
  }
  var ctx=cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  var sx=cv.width/1000, sy=cv.height/540;
  particles.forEach(function(p,i){
    p.t+=p.sp;
    if (p.t>=1) { particles[i]=mkPart(); particles[i].t=0; return; }
    p.op = p.t<0.15 ? p.t/0.15 : p.t>0.85 ? (1-p.t)/0.15 : 1;
    var pt=bez(p.t,p.e.ax,p.e.ay,p.e.cx,p.e.cy,p.e.bx,p.e.by);
    var x=pt.x*sx, y=pt.y*sy;
    ctx.save();
    ctx.globalAlpha=p.op*0.9;
    ctx.shadowBlur=14; ctx.shadowColor='#ffffff';
    ctx.fillStyle='#ffffff';
    ctx.beginPath(); ctx.arc(x,y,3,0,6.283185); ctx.fill();
    ctx.restore();
  });
  rafId=requestAnimationFrame(animateParts);
}

// LEGENDA
function renderLegend() {
  var areas={};
  notes.forEach(function(n){ areas[n.area]=1; });
  document.getElementById('leg').innerHTML = Object.keys(areas).map(function(a){
    var info=(AREA[a])||{label:a,color:'#8a90a6'};
    return '<div class="leg-i"><div class="leg-dot" style="background:'+info.color+'"></div>'+info.label+'</div>';
  }).join('');
}

// MODAL
document.getElementById('btn-add').addEventListener('click', openNew);
document.getElementById('btn-reload').addEventListener('click', function(){ renderGraph(); updateCounter(); renderLegend(); });
document.getElementById('mb-cxl').addEventListener('click', closeModal);
document.getElementById('mb-save').addEventListener('click', saveModal);
document.getElementById('mb-del').addEventListener('click', delModal);
document.getElementById('mdl-ov').addEventListener('click', function(e){ if(e.target===document.getElementById('mdl-ov')) closeModal(); });

function openNew() {
  editId=null;
  document.getElementById('mdl-title').textContent='NOVA NOTA';
  document.getElementById('mn-title').value='';
  document.getElementById('mn-area').value='meta';
  document.getElementById('mn-body').value='';
  document.getElementById('mb-del').style.display='none';
  document.getElementById('mdl-ov').classList.add('show');
}
function openEdit(id) {
  var note=notes.filter(function(n){ return n.id===id; })[0];
  if (!note) return;
  editId=id;
  document.getElementById('mdl-title').textContent='EDITAR NOTA';
  document.getElementById('mn-title').value=note.title;
  document.getElementById('mn-area').value=note.area;
  document.getElementById('mn-body').value=note.body;
  document.getElementById('mb-del').style.display='inline-block';
  document.getElementById('mdl-ov').classList.add('show');
}
function closeModal() { document.getElementById('mdl-ov').classList.remove('show'); editId=null; }
function saveModal() {
  var title=document.getElementById('mn-title').value.trim();
  var area=document.getElementById('mn-area').value;
  var body=document.getElementById('mn-body').value.trim();
  if (!title) return;
  if (editId) {
    var i=-1;
    notes.forEach(function(n,idx){ if(n.id===editId) i=idx; });
    if (i>=0) notes[i]=Object.assign({},notes[i],{title:title,area:area,body:body});
  } else { notes.push({id:'nm'+Date.now(),area:area,title:title,body:body}); }
  persist(); renderGraph(); updateCounter(); renderLegend(); closeModal();
}
function delModal() {
  if (!editId) return;
  notes=notes.filter(function(n){ return n.id!==editId; });
  persist(); renderGraph(); updateCounter(); renderLegend(); closeModal();
}

window.openEdit = openEdit;
</script>
